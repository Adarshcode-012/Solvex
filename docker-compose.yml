services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      MEMORY_BACKEND: ${MEMORY_BACKEND:-chroma}
      REDIS_URL: redis://redis:6379/0
      RATE_LIMIT_STORAGE_URI: redis://redis:6379/1
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - solvex_memory:/app/memory/data
      - solvex_chroma:/app/memory/chroma_db
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: redis-server --appendonly yes
    volumes:
      - solvex_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "5173:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  solvex_memory:
  solvex_chroma:
  solvex_redis:
